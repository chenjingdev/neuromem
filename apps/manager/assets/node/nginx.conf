worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  client_max_body_size 16m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream control_api {
    server control:8000;
    keepalive 32;
  }

  upstream mcp_api {
    server mcp:3001;
    keepalive 16;
  }

  upstream web_app {
    server web:8080;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /health {
      proxy_pass http://control_api/health;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
    }

    location /api/ {
      proxy_pass http://control_api;
      proxy_http_version 1.1;
      # Native folder selection is an explicit user interaction and may stay
      # open longer than nginx's default 60-second upstream timeout.
      proxy_read_timeout 610s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # Existing product memory pages use /core-api. The Node edge sends
    # them to Control with the caller's product session instead of injecting a
    # shared Core credential in the Web container.
    location /core-api/ {
      rewrite ^/core-api/(.*)$ /api/$1 break;
      proxy_pass http://control_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location /mcp {
      proxy_pass http://mcp_api;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Authorization $http_authorization;
    }

    location / {
      proxy_pass http://web_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }
  }
}
