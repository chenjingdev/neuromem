name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e 'apps/core[dev]'
      - run: ruff check apps/core
      - run: ruff format --check apps/core
      - run: pytest apps/core/tests -m 'not postgres'

  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e 'apps/control[dev]'
      - run: ruff check apps/control
      - run: ruff format --check apps/control
      - run: pytest apps/control/tests

  compose:
    runs-on: ubuntu-latest
    needs: [javascript, core, control]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.yaml config
        env:
          NODE_ID: 0195f7de-5b66-7000-8000-000000000099
          POSTGRES_PASSWORD: ci-password
          API_TOKEN: ci-api-token
          MCP_TOKEN: ci-mcp-token
          DB_VOLUME_NAME: neuromem-ci-db-g1
          MCP_STATE_VOLUME_NAME: neuromem-ci-mcp
      - run: docker compose --env-file deploy/node/node.env.example -f deploy/node/compose.yaml config --quiet
